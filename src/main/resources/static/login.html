<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In – ParkSmart</title>
    <link rel="stylesheet" href="/css/style.css">
    <link rel="stylesheet" href="/css/auth.css">
</head>
<body class="auth-page">

<div class="auth-wrapper">
    <!-- Brand -->
    <div class="auth-logo">
        <div class="auth-logo-icon">🅿</div>
        <h1>ParkSmart</h1>
        <p>Smart Parking Management System</p>
    </div>

    <!-- Card -->
    <div class="auth-card">
        <div class="auth-card-header">
            <h2>Welcome back</h2>
            <p>Sign in to your account to continue</p>
        </div>

        <div class="auth-card-body">
            <!-- Alert -->
            <div class="auth-alert" id="login-alert" role="alert">
                <span id="login-alert-msg"></span>
            </div>

            <form id="login-form" class="auth-form" novalidate autocomplete="off">
                <!-- Username -->
                <div class="form-group">
                    <label for="username">Username</label>
                    <div class="input-wrapper">
                        <span class="input-icon">👤</span>
                        <input
                            type="text"
                            id="username"
                            name="username"
                            placeholder="Enter your username"
                            autocomplete="username"
                            required
                        >
                    </div>
                    <span class="field-error" id="username-error"></span>
                </div>

                <!-- Password -->
                <div class="form-group">
                    <label for="password">Password</label>
                    <div class="input-wrapper">
                        <span class="input-icon">🔒</span>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Enter your password"
                            autocomplete="current-password"
                            required
                        >
                        <button type="button" class="pw-toggle" id="pw-toggle" title="Toggle password">👁</button>
                    </div>
                    <span class="field-error" id="password-error"></span>
                </div>

                <button type="submit" class="auth-submit" id="login-submit">Sign In</button>
            </form>
        </div>

        <div class="auth-card-footer">
            Don't have an account? <a href="/register.html">Create one</a>
        </div>
    </div>
</div>

<!-- Scripts -->
<script src="/js/api.js"></script>
<script src="/js/auth.js"></script>
<script src="/js/login.js"></script>
</body>
</html>
